# Render blueprint: one web service, built from the Dockerfile.
#
# The API and the frontend ship together and are served from one origin,
# because the frontend calls "/api/..." with no host -- which also means the
# WebSocket needs no second origin and there is no CORS preflight.
#
# The database is Neon, not Render: set DATABASE_URL to the Neon connection
# string. On an empty database the service seeds the demo fleet on first boot.
services:
  - type: web
    name: ekta
    runtime: docker
    plan: free
    # Singapore, beside the Neon project in aws-ap-southeast-1, and nearest
    # the operation's own users. Co-location is not a nicety: these endpoints
    # issue dozens of queries each, so a cross-region hop multiplies. Measured
    # on this service, moving the database into the same region took the
    # assignment board from 32s to 0.8s.
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/system/health
    autoDeployTrigger: commit
    envVars:
      # Neon's connection string. Set in the Render dashboard or with
      # `render env set` -- never committed.
      - key: DATABASE_URL
        sync: false
      # Signs every session token. Generated once by Render and kept.
      - key: JWT_SECRET
        generateValue: true
      # The portal and driver app accept this one code for any number. A
      # placeholder until an SMS gateway is wired in; see app/config.py.
      - key: PORTAL_OTP_FIXED
        value: "12345"
      - key: ALERT_SCAN_SECONDS
        value: "60"
